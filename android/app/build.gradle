plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.airport_travel_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.airport_travel_app"
        minSdkVersion 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }

    // APK Renaming Logic
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                def appName = "AirportTravelApp"
                def versionName = variant.versionName
                def versionCode = variant.versionCode
                def buildType = variant.buildType.name
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                def date = new Date().format("yyyyMMdd")

                def baseName = "${appName}-v${versionName}(${versionCode})-${buildType}-${date}"
                def newName = (abi != null) ? "${baseName}-${abi}.apk" : "${baseName}.apk"

                output.outputFileName = newName
            }
        }
    }
}

flutter {
    source = "../.."
}
